[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdstomatrix"
version = "1.1.0"
description = "An automated pipeline for stomatal detection, segmentation and trait extraction in Brachypodium."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"
authors = [
  { name = "Pawandeep Singh Kohli" },
  { name = "Ana Stojiljkovic" },
  { name = "Anne C. Roulin" },
  { name = "Michael T Raissig" },
]
keywords = [
  "Brachypodium",
  "stomata",
  "computer vision",
  "image segmentation",
  "plant phenotyping",
  "spatial traits",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "Pillow==12.1.0",
  "tifffile==2026.1.14",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "ultralytics==8.4.6",
]

[project.urls]
Homepage = "https://github.com/pdeep2295/BdStomatrix"
Repository = "https://github.com/pdeep2295/BdStomatrix"
Documentation = "https://github.com/pdeep2295/BdStomatrix#readme"
Issues = "https://github.com/pdeep2295/BdStomatrix/issues"

# BdStomatrix is distributed as a source-and-model bundle. The reproducible
# runtime installation is defined by environment.yaml; this metadata file does
# not restructure the release into a wheel or relocate its checkpoint files.
[tool.setuptools]
py-modules = []
