name: bdstomatrix

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pip:
      # Direct, tested BdStomatrix runtime dependencies. Ultralytics installs
      # its additional transitive Python dependencies automatically.
      - numpy==1.26.4
      - opencv-python==4.11.0.86
      - Pillow==12.1.0
      - tifffile==2026.1.14
      - torch==2.10.0
      - torchvision==0.25.0
      - ultralytics==8.4.6
